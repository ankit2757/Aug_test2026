trigger:
  branches:
    include:
      - main
      - feature/*

# PR validation
pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.9.8'
  workingDirectory: 'terraform'

stages:

# ============================================================
# STAGE 1 - SECURITY SCAN
# ============================================================

- stage: Security
  displayName: 'Security Scan'

  jobs:
  - job: SecurityScan
    displayName: 'Terraform Security Scan'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - script: |
        echo "Installing tfsec..."
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      displayName: 'Install tfsec'

    - script: |
        cd $(workingDirectory)

        echo "Running Terraform Security Scan..."

        tfsec . \
          --format default \
          --soft-fail=false
      displayName: 'Run tfsec'


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan
  displayName: 'Terraform Plan'

  dependsOn: Security

  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Init & Plan'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: 'Azure-Service-Connection'
        backendAzureRmResourceGroupName: 'terraform-state-rg'
        backendAzureRmStorageAccountName: 'tfstatestorage'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: 'Azure-Service-Connection'
        commandOptions: '-out=tfplan'

    - publish: '$(workingDirectory)/tfplan'
      artifact: terraform-plan
      displayName: 'Publish Terraform Plan'


# ============================================================
# STAGE 3 - APPLY
# Only after merge to MAIN
# ============================================================

- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn:
    - Security
    - Plan

  # Apply ONLY when pipeline is running on main branch
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:

  # ----------------------------------------------------------
  # Manual Approval Environment
  # ----------------------------------------------------------

  - deployment: TerraformApply
    displayName: 'Terraform Apply'
    environment: 'terraform-production'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: 'Azure-Service-Connection'
              backendAzureRmResourceGroupName: 'terraform-state-rg'
              backendAzureRmStorageAccountName: 'tfstatestorage'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'terraform.tfstate'

          - download: current
            artifact: terraform-plan
            displayName: 'Download Terraform Plan'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: 'Azure-Service-Connection'
              commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'